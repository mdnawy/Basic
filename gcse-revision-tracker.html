<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 50%,#fbc2eb 100%);min-height:100vh;color:#2d3436;padding:16px;padding-top:env(safe-area-inset-top,16px)}
h1{font-size:28px;font-weight:800;margin-bottom:16px;color:#6c5ce7;text-shadow:0 1px 2px rgba(0,0,0,0.05)}
h2{font-size:20px;font-weight:700;margin-bottom:12px;color:#6c5ce7}
.card{background:rgba(255,255,255,0.9);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,0.06);border:1px solid rgba(255,255,255,0.8)}
.btn{padding:14px 20px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:48px;touch-action:manipulation;transition:transform 0.1s,box-shadow 0.1s}
.btn:active{transform:scale(0.95)}
.btn-primary{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:white;box-shadow:0 3px 10px rgba(162,155,254,0.4)}
.btn-danger{background:linear-gradient(135deg,#fd79a8,#e84393);color:white;box-shadow:0 3px 10px rgba(253,121,168,0.3)}
.btn-secondary{background:#f8f9fa;color:#2d3436;box-shadow:0 2px 6px rgba(0,0,0,0.04);border:1px solid #eee}
.btn-success{background:linear-gradient(135deg,#55efc4,#00b894);color:white;box-shadow:0 3px 10px rgba(85,239,196,0.3)}
.btn-small{padding:10px 16px;font-size:14px;min-height:44px}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nav{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.nav-crumb{font-size:15px;color:#6c5ce7;cursor:pointer;font-weight:500}
.nav-crumb:hover{opacity:0.8}
.nav-crumb.current{cursor:default;font-weight:700;color:#2d3436}
.nav-sep{color:#b2bec3;font-size:14px}
.conf{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:white;text-transform:uppercase}
.conf-low{background:#fd79a8}
.conf-average{background:#fdcb6e}
.conf-high{background:#55efc4}
.meta{font-size:13px;color:#86868b;margin-top:4px}
.meta.stale{color:#e84393;font-weight:600}
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.heat-cell{border-radius:14px;padding:14px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.heat-cell:active{transform:scale(0.95)}
.heat-cell .subj-name{font-size:14px;font-weight:700;color:white}
.heat-cell .subj-meta{font-size:11px;color:rgba(255,255,255,0.9);margin-top:4px}
.heat-green{background:linear-gradient(135deg,#55efc4,#00b894);box-shadow:0 4px 12px rgba(85,239,196,0.3)}
.heat-amber{background:linear-gradient(135deg,#fdcb6e,#f39c12);box-shadow:0 4px 12px rgba(253,203,110,0.3)}
.heat-red{background:linear-gradient(135deg,#fd79a8,#e84393);box-shadow:0 4px 12px rgba(253,121,168,0.3)}
.heat-grey{background:linear-gradient(135deg,#dfe6e9,#b2bec3);box-shadow:0 4px 12px rgba(223,230,233,0.3)}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.item-row:last-child{border-bottom:none}
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:600}
.item-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:white;border-radius:20px;padding:24px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.modal h2{margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:#86868b;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border:2px solid #e8e8ed;border-radius:12px;font-size:16px;-webkit-appearance:none;transition:border-color 0.2s}
.field input:focus,.field select:focus{outline:none;border-color:#a29bfe}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.summary-bar{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.summary-stat{text-align:center;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-radius:14px;padding:12px 16px;min-width:80px;border:1px solid rgba(255,255,255,0.8)}
.summary-stat .num{font-size:26px;font-weight:800;color:#6c5ce7}
.summary-stat .label{font-size:11px;color:#636e72;text-transform:uppercase;font-weight:600}
</style>

  if(!dateStr) return null;
  return Math.floor((Date.now()-new Date(dateStr).getTime())/86400000);
}

  items.forEach(item=>{
    const d=daysSince(item.lastRevised);
    if(d===null) worst=999;
    else if(d>worst) worst=d;
    if(deep && item.subtopics) item.subtopics.forEach(st=>{
      const sd=daysSince(st.lastRevised);
      if(sd===null) worst=999;
      else if(sd>worst) worst=sd;
    });
  });
  return worst;
}
// FIXED RAG: <14d=green, 14-30d=amber, >30d or never=red
function ragColor(days){
  if(days===null||days>=30) return 'red';
  if(days>=14) return 'amber';
  return 'green';
}
function heatClass(subj){
  if(!subj.topics.length) return 'heat-grey';
  const w=worstDays(subj.topics, false);
  if(w>=30) return 'heat-red';
  if(w>=14) return 'heat-amber';
  return 'heat-green';
}
function subjectLastRevised(subj){
  let dates=[];
  subj.topics.forEach(t=>{
    if(t.lastRevised) dates.push(t.lastRevised);
    (t.subtopics||[]).forEach(st=>{if(st.lastRevised) dates.push(st.lastRevised)});
  });
  if(!dates.length) return null;
  return daysSince(dates.sort().pop());
}
function today(){return new Date().toISOString().split('T')[0]}
function formatDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}

function renderHome(){
  const app=document.getElementById('app');
  const totalTopics=data.subjects.reduce((s,subj)=>s+subj.topics.length+subj.topics.reduce((a,t)=>a+(t.subtopics||[]).length,0),0);
  const staleCount=data.subjects.filter(s=>s.topics.length&&worstDays(s.topics,false)>=30).length;
  let html=`<div class="summary-bar">
    <div class="summary-stat"><div class="num">${data.subjects.length}</div><div class="label">Subjects</div></div>
    <div class="summary-stat"><div class="num">${totalTopics}</div><div class="label">Topics</div></div>
    <div class="summary-stat"><div class="num">${staleCount}</div><div class="label">⚠️ Needs Attention</div></div>
  </div>`;
  html+=`<div class="card"><h2>📊 Revision Progress</h2><div class="heatmap">`;
  data.subjects.forEach((subj,i)=>{
    const d=subjectLastRevised(subj);
    const dText=d===null?'Not started':d+'d ago';
    html+=`<div class="heat-cell ${heatClass(subj)}" onclick="openSubject(${i})">
      <div class="subj-name">${subj.name}</div>
      <div class="subj-meta">${dText}</div>
    </div>`;
  });
  html+=`</div></div>`;
  app.innerHTML=html;
}

function renderSubject(){
  const subj=data.subjects[view.subjectIdx];
  const app=document.getElementById('app');
  const d=subjectLastRevised(subj);
  let html=`<div class="nav">
    <span class="nav-crumb" onclick="goHome()">🏠 Home</span><span class="nav-sep">›</span>
    <span class="nav-crumb current">${subj.name}</span>
  </div>`;
  html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><h2 style="margin:0">${subj.name}</h2>
    <div class="meta">${d===null?'No revision data yet':'Last revised '+d+' day'+(d===1?'':'s')+' ago'}</div></div>
    <div style="display:flex;gap:6px"><button class="btn btn-small btn-primary" onclick="addTopic()">➕ Topic</button>
    <button class="btn btn-small btn-danger" onclick="deleteSubject(${view.subjectIdx})">🗑️</button></div>
  </div></div>`;
  if(!subj.topics.length){
    html+=`<div class="card"><p style="color:#86868b;text-align:center">No topics yet — add one to start tracking! 🚀</p></div>`;
  } else {
    subj.topics.forEach((t,ti)=>{
      const td=daysSince(t.lastRevised);
      const color=ragColor(td);
      const borderColor=color==='red'?'#fd79a8':color==='amber'?'#fdcb6e':'#55efc4';
      html+=`<div class="card" style="border-left:4px solid ${borderColor}">
        <div class="item-row" style="border:none;padding:0">
          <div class="item-info" onclick="openTopic(${ti})" style="cursor:pointer">
            <div class="item-name">${t.name} ${t.confidence?'<span class="conf conf-'+t.confidence+'">'+t.confidence+'</span>':''}</div>
            <div class="meta ${color==='red'?'stale':''}">${t.lastRevised?formatDate(t.lastRevised)+' ('+td+'d ago)'+(color==='red'?' 🚨':''):'Never revised 🚨'}</div>
            ${(t.subtopics||[]).length?'<div class="meta">'+t.subtopics.length+' subtopic'+(t.subtopics.length===1?'':'s')+'</div>':''}
          </div>
          <div class="item-actions">
            <button class="btn btn-small btn-secondary" onclick="editTopic(${ti})">✏️</button>
            <button class="btn btn-small btn-success" onclick="revise(${ti})">✅</button>
          </div>
        </div>
      </div>`;
    });
  }
  app.innerHTML=html;
}

function renderTopic(){
  const subj=data.subjects[view.subjectIdx];
  const topic=subj.topics[view.topicIdx];
  const app=document.getElementById('app');
  let html=`<div class="nav">
    <span class="nav-crumb" onclick="goHome()">🏠 Home</span><span class="nav-sep">›</span>
    <span class="nav-crumb" onclick="openSubject(${view.subjectIdx})">${subj.name}</span><span class="nav-sep">›</span>
    <span class="nav-crumb current">${topic.name}</span>
  </div>`;
  const td=daysSince(topic.lastRevised);
  html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><h2 style="margin:0">${topic.name}</h2>
    <div class="meta">${topic.lastRevised?'Last revised: '+formatDate(topic.lastRevised)+' ('+td+'d ago)':'Never revised'}</div>
    ${topic.confidence?'<div style="margin-top:6px"><span class="conf conf-'+topic.confidence+'">'+topic.confidence+'</span></div>':''}
    </div>
    <button class="btn btn-small btn-primary" onclick="addSubtopic()">➕ Subtopic</button>
  </div></div>`;
  if(!(topic.subtopics||[]).length){
    html+=`<div class="card"><p style="color:#86868b;text-align:center">No subtopics yet. Add one to get granular! 🎯</p></div>`;
  } else {
    html+=`<div class="card">`;
    topic.subtopics.forEach((st,si)=>{
      const sd=daysSince(st.lastRevised);
      const color=ragColor(sd);
      html+=`<div class="item-row">
        <div class="item-info">
          <div class="item-name">${st.name} ${st.confidence?'<span class="conf conf-'+st.confidence+'">'+st.confidence+'</span>':''}</div>
          <div class="meta ${color==='red'?'stale':''}">${st.lastRevised?formatDate(st.lastRevised)+' ('+sd+'d ago)'+(color==='red'?' 🚨':''):'Never revised 🚨'}</div>
        </div>
        <div class="item-actions">
          <button class="btn btn-small btn-secondary" onclick="editSubtopic(${si})">✏️</button>
          <button class="btn btn-small btn-success" onclick="reviseSubtopic(${si})">✅</button>
          <button class="btn btn-small btn-danger" onclick="deleteSubtopic(${si})">✕</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  app.innerHTML=html;
}

// Navigation
function goHome(){view={page:'home'};render()}
function openSubject(i){view={page:'subject',subjectIdx:i};render()}
function openTopic(i){view.page='topic';view.topicIdx=i;render()}

// Modals
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}

// Subject CRUD
function addSubject(){
  showModal(`<h2>➕ Add Subject</h2>
    <div class="field"><label>Name</label><input id="f_name" placeholder="e.g. Chemistry"></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveNewSubject()">Add</button></div>`);
}
function saveNewSubject(){
  const n=document.getElementById('f_name').value.trim();if(!n)return;
  data.subjects.push({name:n,topics:[]});save();closeModal();render();
}
function deleteSubject(i){
  if(!confirm('Delete '+data.subjects[i].name+' and all its topics?'))return;
  data.subjects.splice(i,1);save();goHome();
}

// Topic CRUD
function addTopic(){
  showModal(`<h2>➕ Add Topic</h2>
    <div class="field"><label>Topic Name</label><input id="f_name" placeholder="e.g. Photosynthesis"></div>
    <div class="field"><label>Last Revised</label><input type="date" id="f_date" value="${today()}"></div>
    <div class="field"><label>Confidence</label><select id="f_conf"><option value="">Not set</option><option value="low">Low</option><option value="average">Average</option><option value="high">High</option></select></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveNewTopic()">Add</button></div>`);
}
function saveNewTopic(){
  const subj=data.subjects[view.subjectIdx];
  const n=document.getElementById('f_name').value.trim();if(!n)return;
  subj.topics.push({name:n,lastRevised:document.getElementById('f_date').value||null,confidence:document.getElementById('f_conf').value||null,subtopics:[]});
  save();closeModal();render();
}
function editTopic(ti){
  const t=data.subjects[view.subjectIdx].topics[ti];
  showModal(`<h2>✏️ Edit Topic</h2>
    <div class="field"><label>Name</label><input id="f_name" value="${t.name}"></div>
    <div class="field"><label>Last Revised</label><input type="date" id="f_date" value="${t.lastRevised||''}"></div>
    <div class="field"><label>Confidence</label><select id="f_conf"><option value="">Not set</option><option value="low" ${t.confidence==='low'?'selected':''}>Low</option><option value="average" ${t.confidence==='average'?'selected':''}>Average</option><option value="high" ${t.confidence==='high'?'selected':''}>High</option></select></div>
    <div class="modal-actions"><button class="btn btn-danger" onclick="deleteTopic(${ti})">🗑️ Delete</button>
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveEditTopic(${ti})">Save</button></div>`);
}
function saveEditTopic(ti){
  const t=data.subjects[view.subjectIdx].topics[ti];
  t.name=document.getElementById('f_name').value.trim()||t.name;
  t.lastRevised=document.getElementById('f_date').value||null;
  t.confidence=document.getElementById('f_conf').value||null;
  save();closeModal();render();
}
function deleteTopic(ti){
  if(!confirm('Delete this topic and all subtopics?'))return;
  data.subjects[view.subjectIdx].topics.splice(ti,1);save();closeModal();
  view.page='subject';view.topicIdx=null;render();
}
function revise(ti){
  data.subjects[view.subjectIdx].topics[ti].lastRevised=today();save();render();
}

// Subtopic CRUD
function addSubtopic(){
  showModal(`<h2>➕ Add Subtopic</h2>
    <div class="field"><label>Name</label><input id="f_name" placeholder="e.g. Light reactions"></div>
    <div class="field"><label>Last Revised</label><input type="date" id="f_date" value="${today()}"></div>
    <div class="field"><label>Confidence</label><select id="f_conf"><option value="">Not set</option><option value="low">Low</option><option value="average">Average</option><option value="high">High</option></select></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveNewSubtopic()">Add</button></div>`);
}
function saveNewSubtopic(){
  const t=data.subjects[view.subjectIdx].topics[view.topicIdx];
  const n=document.getElementById('f_name').value.trim();if(!n)return;
  if(!t.subtopics)t.subtopics=[];
  t.subtopics.push({name:n,lastRevised:document.getElementById('f_date').value||null,confidence:document.getElementById('f_conf').value||null});
  save();closeModal();render();
}
function editSubtopic(si){
  const st=data.subjects[view.subjectIdx].topics[view.topicIdx].subtopics[si];
  showModal(`<h2>✏️ Edit Subtopic</h2>
    <div class="field"><label>Name</label><input id="f_name" value="${st.name}"></div>
    <div class="field"><label>Last Revised</label><input type="date" id="f_date" value="${st.lastRevised||''}"></div>
    <div class="field"><label>Confidence</label><select id="f_conf"><option value="">Not set</option><option value="low" ${st.confidence==='low'?'selected':''}>Low</option><option value="average" ${st.confidence==='average'?'selected':''}>Average</option><option value="high" ${st.confidence==='high'?'selected':''}>High</option></select></div>
    <div class="modal-actions"><button class="btn btn-danger" onclick="deleteSubtopic(${si})">🗑️ Delete</button>
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveEditSubtopic(${si})">Save</button></div>`);
}
function saveEditSubtopic(si){
  const st=data.subjects[view.subjectIdx].topics[view.topicIdx].subtopics[si];
  st.name=document.getElementById('f_name').value.trim()||st.name;
  st.lastRevised=document.getElementById('f_date').value||null;
  st.confidence=document.getElementById('f_conf').value||null;
  save();closeModal();render();
}
function deleteSubtopic(si){
  if(!confirm('Delete this subtopic?'))return;
  data.subjects[view.subjectIdx].topics[view.topicIdx].subtopics.splice(si,1);
  save();closeModal();render();
}
function reviseSubtopic(si){
  data.subjects[view.subjectIdx].topics[view.topicIdx].subtopics[si].lastRevised=today();
  save();render();
}

// Export/Import
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='gcse-revision-'+today()+'.json';a.click();
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{const d=JSON.parse(ev.target.result);if(d.subjects){data=d;save();render();alert('Imported! 🎉');}else alert('Invalid file');}
    catch{alert('Error reading file');}
  };r.readAsText(file);e.target.value='';
}

render();
</script>
